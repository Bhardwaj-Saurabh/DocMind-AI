version: '3.8'

services:
  api:
    build: .
    container_name: docmind-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VISION_MODEL=${VISION_MODEL:-gpt-4o}
      - VISION_PROVIDER=${VISION_PROVIDER:-openai}
    volumes:
      # Mount uploads directory (optional, for persistent storage)
      - ./uploads:/app/uploads
      # Mount logs (optional)
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

